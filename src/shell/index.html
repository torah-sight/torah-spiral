<!doctype html>
<html lang="ru" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Иконка сайта встроена (src/shell/logo.ts): золотая Алеф в витке спирали, без отдельного файла. -->
    <link rel="icon" type="image/png" href="<%= logoUri %>" />
    <meta name="description" content="Спиральное изучение Торы: 54 недельные главы, этажи раскрытия по плотности текста." />
    <title><%= htmlPlugin.options.title %></title>
    <script>
      // Тема до первого рендера — без мигания светлой страницы у тёмной темы.
      try {
        var prefs = JSON.parse(localStorage.getItem('torah-spiral/prefs') || '{}');
        document.documentElement.dataset.theme = prefs.theme === 'dark' ? 'dark' : 'light';
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
