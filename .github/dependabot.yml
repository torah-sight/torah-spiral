version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      runtime:
        dependency-type: production
    ignore:
      # Типы Node — в версии рантайма (Node 24 в CI и engines), без мажорных скачков.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
