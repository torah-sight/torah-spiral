name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Carburetor oxlint plugin spawns carburetor-lint from inside oxlint, whose large reserved
      # address space makes fork() fail with ENOMEM under the default overcommit heuristic.
      - name: Allow overcommit for spawning carburetor-lint
        run: sudo sysctl -w vm.overcommit_memory=1
      - name: Lint (oxlint + carburetor-lint + structure)
        run: npm run lint
      - name: oxlint details (GitHub annotations drop plugin messages)
        if: failure()
        run: npx oxlint --deny-warnings --format stylish | head -100
      - name: Typecheck (tsgo)
        run: npm run typecheck
      - name: Unit tests (rstest)
        run: npm test
      - name: Docs in three languages match root-docs/ (polydoc)
        run: npm run docs:check
      - name: Content against the Torah text (Sefaria)
        run: npm run content:check
      - name: Build single-file site
        run: npm run build
      - name: Check that dist is a self-contained page plus its language copies
        run: |
          test "$(find dist -type f | sort | xargs)" = "dist/en/index.html dist/he/index.html dist/index.html dist/ru/index.html"
          ! grep -Eq '<script[^>]+src=|<link[^>]+stylesheet' dist/index.html dist/*/index.html
          grep -q '<html lang="he" dir="rtl">' dist/he/index.html
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
        with:
          path: dist

  # Pages on the free plan works only for public repositories.
  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
